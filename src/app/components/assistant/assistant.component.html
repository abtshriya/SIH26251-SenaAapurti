<!-- ================= SENAAAPURTI VIRTUAL ASSISTANT WIDGET ================= -->

<!-- 1. Floating Launcher Round Badge (Screenshot Fidelity) -->
<div class="assistant-launcher-container" *ngIf="!assistantService.isOpen()">
  <button
    type="button"
    class="launcher-badge-btn"
    (click)="toggleChat()"
    aria-label="Open Ask SenaAapurti Assistant"
    title="Ask SenaAapurti Assistant (Jai Hind)">
    
    <!-- Outer Curved Circular Badge with Tricolor & Officer Silhouette -->
    <svg class="launcher-badge-svg" viewBox="0 0 100 100" width="86" height="86">
      <defs>
        <!-- Top Arc Path for 'JAI HIND' -->
        <path id="launcher-top-path" d="M 15,50 A 35,35 0 0,1 85,50" fill="none" />
        <!-- Bottom Arc Path for 'ASK SENA AAPURTI ASSISTANT' -->
        <path id="launcher-bot-path" d="M 86,50 A 36,36 0 0,1 14,50" fill="none" />
        
        <!-- Tricolor Gradient / Clip for Center -->
        <clipPath id="inner-circle-clip">
          <circle cx="50" cy="50" r="28" />
        </clipPath>
      </defs>

      <!-- Outer Navy Border Ring -->
      <circle cx="50" cy="50" r="48" fill="#0b1b36" stroke="#ffffff" stroke-width="2" />
      <circle cx="50" cy="50" r="38" fill="#0b1b36" stroke="rgba(255,255,255,0.4)" stroke-width="1" />

      <!-- Curved Top Text: JAI HIND -->
      <text font-family="'Rajdhani', 'Inter', sans-serif" font-weight="800" font-size="10" fill="#ffffff" letter-spacing="1.5">
        <textPath href="#launcher-top-path" startOffset="50%" text-anchor="middle">
          JAI HIND
        </textPath>
      </text>

      <!-- Curved Bottom Text: ASK SENA AAPURTI ASSISTANT -->
      <text font-family="'Inter', sans-serif" font-weight="700" font-size="5.5" fill="#ffffff" letter-spacing="0.6">
        <textPath href="#launcher-bot-path" startOffset="50%" text-anchor="middle">
          ASK SENA AAPURTI ASSISTANT
        </textPath>
      </text>

      <!-- Inner Tricolor Disk with Clip -->
      <g clip-path="url(#inner-circle-clip)">
        <!-- Saffron (Top) -->
        <rect x="20" y="20" width="60" height="20" fill="#ff9933" />
        <!-- White (Middle) -->
        <rect x="20" y="38" width="60" height="22" fill="#ffffff" />
        <!-- Green (Bottom) -->
        <rect x="20" y="58" width="60" height="22" fill="#138808" />
        <!-- Soft Inner Shadow Overlay -->
        <circle cx="50" cy="50" r="28" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" />
      </g>

      <!-- Officer Silhouette with Peaked Service Cap & Uniform -->
      <g class="officer-silhouette-icon" fill="#1b3323">
        <!-- Peaked Cap Visor & Crown -->
        <path d="M 37,35 C 37,30 43,26 50,26 C 57,26 63,30 63,35 C 63,37 60,38 50,38 C 40,38 37,37 37,35 Z" />
        <!-- Cap Band & Emblem -->
        <ellipse cx="50" cy="36" rx="11" ry="2.2" fill="#2d4a36" />
        <circle cx="50" cy="33" r="1.8" fill="#d4af37" />
        <!-- Cap Peak / Visor -->
        <path d="M 39,37 C 44,40 56,40 61,37 C 62,38 60,40 50,40 C 40,40 38,38 39,37 Z" fill="#0d1f14" />
        <!-- Face Profile Silhouette -->
        <circle cx="50" cy="42" r="6" />
        <path d="M 46,46 L 46,50 L 54,50 L 54,46 Z" />
        <!-- Shoulders / Torso / Collar -->
        <path d="M 34,68 C 34,56 42,50 46,49 L 50,53 L 54,49 C 58,50 66,56 66,68 Z" />
        <!-- Collar Tie Detail -->
        <polygon points="50,53 48,59 52,59" fill="#ffffff" />
        <polygon points="48,59 52,59 50,67" fill="#0d1f14" />
      </g>
    </svg>

    <!-- Subtle Live Indicator Badge -->
    <span class="launcher-online-dot" title="Assistant Active"></span>
  </button>
</div>

<!-- 2. Assistant Chat Window (Matching Screenshot) -->
<div class="assistant-modal-window" *ngIf="assistantService.isOpen()" role="dialog" aria-modal="true" aria-label="Ask SenaAapurti Assistant">
  
  <!-- Header: Army Green Bar with Crossed Swords Emblem, Title & Close Button -->
  <div class="assistant-header-bar">
    <div class="header-left">
      <!-- Indian Army Crossed Swords Gold Roundel Badge -->
      <div class="army-emblem-badge" title="Indian Army Logistics Insignia">
        <svg viewBox="0 0 40 40" width="34" height="34" class="army-emblem-svg">
          <!-- Outer Gold Ring -->
          <circle cx="20" cy="20" r="18" fill="url(#goldGrad)" stroke="#ffd700" stroke-width="1.5" />
          <defs>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f6d365" />
              <stop offset="50%" stop-color="#fda085" />
              <stop offset="100%" stop-color="#d4af37" />
            </linearGradient>
          </defs>
          <!-- Red Circular Core -->
          <circle cx="20" cy="20" r="14.5" fill="#a7281f" />
          <!-- Gold Crossed Swords (Indian Army Insignia) -->
          <g stroke="#ffffff" stroke-width="1.2" stroke-linecap="round">
            <!-- Sword 1 -->
            <line x1="10" y1="10" x2="30" y2="30" />
            <line x1="9" y1="12" x2="12" y2="9" stroke-width="2" />
            <circle cx="9.5" cy="10.5" r="1" fill="#ffffff" />
            <!-- Sword 2 -->
            <line x1="30" y1="10" x2="10" y2="30" />
            <line x1="31" y1="12" x2="28" y2="9" stroke-width="2" />
            <circle cx="30.5" cy="10.5" r="1" fill="#ffffff" />
          </g>
          <!-- Ashoka Lion Pillar Crest (Gold Center) -->
          <path d="M 18,14 L 22,14 L 21.5,19 L 22.5,23 L 17.5,23 L 18.5,19 Z" fill="#ffd700" />
          <circle cx="20" cy="13" r="1.5" fill="#ffd700" />
        </svg>
      </div>

      <!-- Title Text -->
      <h3 class="header-title">Ask SenaAapurti Assistant</h3>
    </div>

    <!-- Close Button '✕' -->
    <button type="button" class="header-close-btn" (click)="closeChat()" aria-label="Close Assistant">
      ✕
    </button>
  </div>

  <!-- Chat Messages Stream -->
  <div class="assistant-body-scroll" #chatScrollContainer>
    <div *ngFor="let msg of assistantService.messages()" class="message-row" [class.user-row]="msg.sender === 'user'">
      
      <!-- Assistant Message Layout (Officer Silhouette on Left) -->
      <ng-container *ngIf="msg.sender === 'assistant'">
        <div class="assistant-avatar-col" aria-hidden="true">
          <!-- Grey Officer Silhouette Avatar (Exact Screenshot Style) -->
          <svg viewBox="0 0 40 40" width="34" height="34" class="officer-avatar-svg">
            <circle cx="20" cy="20" r="19" fill="#e5e9e6" />
            <g fill="#7a8b80">
              <!-- Officer Peaked Cap -->
              <path d="M 12,14 C 12,10 16,7 20,7 C 24,7 28,10 28,14 C 28,15 26,16 20,16 C 14,16 12,15 12,14 Z" />
              <path d="M 13,15 C 16,18 24,18 27,15 C 28,16 26,17 20,17 C 14,17 12,16 13,15 Z" fill="#526358" />
              <circle cx="20" cy="12" r="1.3" fill="#ffffff" />
              <!-- Head Silhouette -->
              <circle cx="20" cy="19" r="4.5" />
              <!-- Neck -->
              <rect x="18" y="23" width="4" height="3" />
              <!-- Shoulders with Lapels & Collar -->
              <path d="M 10,34 C 10,27 16,24 18,24 L 20,27 L 22,24 C 24,24 30,27 30,34 Z" />
              <!-- Epaulettes / Tie Detail -->
              <polygon points="20,27 18.5,31 21.5,31" fill="#ffffff" />
              <polygon points="18.5,31 21.5,31 20,34" fill="#526358" />
            </g>
          </svg>
        </div>

        <div class="assistant-bubble-col">
          <!-- Assistant Text Bubble -->
          <div class="assistant-text-content">
            <div class="text-paragraphs" [innerHTML]="formatMessageText(msg.text)"></div>
          </div>

          <!-- Quick Reply Action Pills (Matching Screenshot) -->
          <div *ngIf="msg.quickReplies && msg.quickReplies.length > 0" class="quick-replies-pill-group">
            <button
              *ngFor="let pill of msg.quickReplies"
              type="button"
              class="quick-reply-pill"
              (click)="onQuickReplyClick(pill)">
              {{ pill }}
            </button>
          </div>
        </div>
      </ng-container>

      <!-- User Message Layout (Bubble on Right + Grey User Silhouette) -->
      <ng-container *ngIf="msg.sender === 'user'">
        <div class="user-bubble-col">
          <div class="user-bubble-box">
            {{ msg.text }}
          </div>
        </div>

        <div class="user-avatar-col" aria-hidden="true">
          <!-- Grey User Silhouette Avatar (Screenshot Style) -->
          <svg viewBox="0 0 40 40" width="32" height="32" class="user-avatar-svg">
            <circle cx="20" cy="20" r="19" fill="#ecefe9" />
            <g fill="#8c9790">
              <!-- Head -->
              <circle cx="20" cy="14" r="5" />
              <!-- Body / Suit Collar -->
              <path d="M 11,31 C 11,24 16,21 20,21 C 24,21 29,24 29,31 Z" />
              <polygon points="20,21 18,26 22,26" fill="#ffffff" />
            </g>
          </svg>
        </div>
      </ng-container>

    </div>

    <!-- Typing Dots Animation while waiting for response -->
    <div *ngIf="assistantService.isLoading()" class="message-row typing-row">
      <div class="assistant-avatar-col">
        <svg viewBox="0 0 40 40" width="34" height="34" class="officer-avatar-svg">
          <circle cx="20" cy="20" r="19" fill="#e5e9e6" />
          <g fill="#7a8b80">
            <circle cx="20" cy="19" r="4.5" />
            <path d="M 10,34 C 10,27 16,24 20,24 C 24,24 30,27 30,34 Z" />
          </g>
        </svg>
      </div>
      <div class="typing-indicator-bubble">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation & Input Controls Bar -->
  <div class="assistant-bottom-bar">
    <!-- Terracotta / Rust-Brown Action Buttons (Screenshot Fidelity) -->
    <div class="action-buttons-strip">
      <!-- 1. Home Button (White Home inside Rust-Brown Square) -->
      <button
        type="button"
        class="btn-terracotta btn-home"
        (click)="onHomeClick()"
        aria-label="Home / Restart Assistant"
        title="Reset to Welcome Menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
        </svg>
      </button>

      <!-- 2. Back Button (White Left Arrow inside Rust-Brown Square) -->
      <button
        type="button"
        class="btn-terracotta btn-back"
        (click)="onBackClick()"
        aria-label="Back to Previous Question"
        title="Go Back">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-4H8l4-4 4 4h-3v4z" transform="rotate(-90 12 12)" />
        </svg>
      </button>
    </div>

    <!-- Text Input Bar for Custom Queries -->
    <form class="assistant-input-form" (submit)="onSubmitMessage(); $event.preventDefault()">
      <input
        type="text"
        [(ngModel)]="userInputText"
        name="userInputText"
        placeholder="Type logistics query or voucher ID..."
        class="assistant-text-input"
        aria-label="Enter question or indent voucher"
        autocomplete="off" />
      
      <button
        type="submit"
        class="assistant-send-btn"
        [disabled]="!userInputText.trim() || assistantService.isLoading()"
        aria-label="Send Message"
        title="Send Query">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
        </svg>
      </button>
    </form>
  </div>

</div>
